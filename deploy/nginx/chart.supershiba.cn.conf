# chart-constructor 静态站点：SPA 回退、版本软链切换和静态资源缓存策略
server {
    listen 80;
    listen [::]:80;
    server_name chart.supershiba.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chart.supershiba.cn;

    ssl_certificate     /etc/nginx/ssl/supershiba.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/supershiba.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/chart-constructor/current;
    index index.html;

    # 关闭文件句柄缓存，保证版本软链切换后立即读取新产物
    open_file_cache off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      application/javascript
      application/json
      image/svg+xml
      font/woff2;

    # Vite 产物带 hash，可长期强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 隐藏发布元数据等点文件
    location ~ /\. {
        deny all;
    }

    # 其余路径交给前端路由，刷新任意地址都回退到入口 HTML
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}

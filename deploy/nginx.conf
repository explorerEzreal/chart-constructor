# playground 静态站点配置：SPA 回退 + 静态资源缓存策略
server {
  listen 80;
  server_name _;

  # current 是指向 releases/<版本> 的相对软链，容器内挂载点为 /srv
  root /srv/current;
  index index.html;

  # 关闭文件句柄缓存，保证软链切换后新版本立即生效
  open_file_cache off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  # 构建产物文件名带 hash，可长期强缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 入口 HTML 不缓存，发版后立即生效
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # 其余路径交给前端路由，刷新任意地址都回退到入口 HTML
  location / {
    try_files $uri $uri/ /index.html;
  }
}
